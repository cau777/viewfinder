[project]
name = "viewfinder-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "astral>=3.2",
    "contextily>=1.7.1",
    "contextly>=1.1.1",
    "fastapi>=0.142",
    "geopandas>=1.1.4",
    "huggingface-hub>=2.1.1",
    "kagglehub>=1.0.2",
    "pyarrow>=25.0.1",
    "pillow>=11",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.30",
    "viewfinder-core",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
]

[tool.uv]
# `uv sync` installs both groups by default; production uses --no-default-groups.
default-groups = ["dev", "notebook"]

[tool.uv.sources]
# Built from ../rust by maturin (the build backend declared there).
viewfinder-core = { path = "../rust" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
